        // --- 1. SOUND SYSTEM (Web Audio API) ---
        let audioCtx;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                // Short subtle blip
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'correct') {
                // Happy double chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                // Low buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'finish') {
                // Success chord
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        const dotIndicators = document.getElementById('dot-indicators');
        const slideCounter = document.getElementById('slide-counter');
        const progressBar = document.getElementById('progress-bar');

        let currentSlideIdx = 0;
        let isQuizMode = false;
        let currentQuizIdx = 0;
        let score = 0;
        let quizCompleted = false;

        const totalSlides = moduleData.length;
        const totalQuiz = quizData.length;

        function init() {
            // Build Main Slides
            moduleData.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide-content w-full h-full flex-col justify-center items-center p-4 md:p-8 animate-fade-in absolute inset-0 bg-white/50 dark:bg-gray-800/50 backdrop-blur-md rounded-2xl border border-gray-200 dark:border-gray-700 shadow-xl overflow-hidden';
                div.id = `slide-${index}`;
                
                if (slide.type === 'cover' || slide.type === 'intro-quiz') {
                    div.innerHTML = `
                        <div class="text-center h-full flex flex-col items-center justify-center space-y-6 max-w-2xl mx-auto">
                            <div class="text-6xl md:text-8xl animate-bounce-slight">${slide.icon}</div>
                            <h2 class="text-2xl md:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400">${slide.title}</h2>
                            <p class="text-sm md:text-lg text-gray-700 dark:text-gray-300 leading-relaxed">${slide.content}</p>
                            ${slide.type === 'intro-quiz' ? '<div class="text-sm text-gray-500 mt-4">(Klik Selanjutnya untuk mulai)</div>' : ''}
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="w-full h-full flex flex-col">
                            <h2 class="text-lg md:text-2xl font-bold mb-4 flex items-center gap-3 border-b-2 border-gray-200 dark:border-gray-700 pb-2 text-indigo-700 dark:text-indigo-400">
                                <span>${slide.icon}</span> ${slide.title}
                            </h2>
                            <div class="flex-1 flex flex-col justify-center overflow-hidden">
                                ${slide.content}
                            </div>
                        </div>
                    `;
                }
                container.appendChild(div);
            });

            // Build Quiz Slides
            quizData.forEach((quiz, index) => {
                const div = document.createElement('div');
                div.className = 'slide-content w-full h-full flex-col justify-center p-4 md:p-8 animate-fade-in absolute inset-0 bg-white/50 dark:bg-gray-800/50 backdrop-blur-md rounded-2xl border border-gray-200 dark:border-gray-700 shadow-xl overflow-hidden';
                div.id = `quiz-${index}`;
                
                let optionsHtml = quiz.options.map((opt, i) => `
                    <button class="quiz-option w-full text-left p-3 md:p-4 mb-3 text-sm md:text-base rounded-xl border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-all font-semibold text-gray-800 dark:text-gray-200" data-idx="${i}">
                        <span class="inline-block w-6 h-6 text-center rounded-full bg-gray-200 dark:bg-gray-700 mr-2">${String.fromCharCode(65 + i)}</span> 
                        ${opt}
                    </button>
                `).join('');

                div.innerHTML = `
                    <div class="w-full h-full flex flex-col max-w-3xl mx-auto">
                        <div class="mb-4 flex justify-between items-center text-xs font-bold uppercase tracking-wider text-gray-500">
                            <span>Pertanyaan ${index + 1}/${totalQuiz}</span>
                            <span>Skor: <span id="score-display-${index}">0</span></span>
                        </div>
                        <h2 class="text-base md:text-xl font-bold mb-6 text-gray-900 dark:text-white leading-relaxed">
                            ${quiz.q}
                        </h2>
                        <div class="options-container flex-1 overflow-y-auto pr-2 pb-10">
                            ${optionsHtml}
                        </div>
                        <div class="explanation-box hidden mt-4 p-4 rounded-xl bg-blue-100 dark:bg-blue-900/50 text-sm border-l-4 border-blue-500 animate-slide-up">
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            // Build Result Slide
            const resultDiv = document.createElement('div');
            resultDiv.className = 'slide-content w-full h-full flex-col justify-center items-center p-8 animate-fade-in absolute inset-0 bg-white/50 dark:bg-gray-800/50 backdrop-blur-md rounded-2xl border border-gray-200 dark:border-gray-700 shadow-xl overflow-hidden';
            resultDiv.id = `quiz-result`;
            resultDiv.innerHTML = `
                <div class="text-center w-full max-w-md mx-auto space-y-6">
                    <div class="text-7xl animate-bounce-slight" id="result-icon">🏆</div>
                    <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white">Hasil Misi</h2>
                    <div class="text-5xl font-black text-blue-600 dark:text-blue-400" id="final-score">0%</div>
                    <p class="text-gray-700 dark:text-gray-300" id="result-message">Luar biasa!</p>
                    <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition w-full">Ulangi Modul 🔄</button>
                </div>
            `;
            container.appendChild(resultDiv);

            // Bind Quiz Logic
            document.querySelectorAll('.quiz-option').forEach(btn => {
                btn.addEventListener('click', handleQuizAnswer);
            });

            updateUI();
        }

        function handleQuizAnswer(e) {
            if (e.currentTarget.disabled) return; // Prevent multiple clicks
            
            const btn = e.currentTarget;
            const container = btn.closest('.slide-content');
            const explanationBox = container.querySelector('.explanation-box');
            const allBtns = container.querySelectorAll('.quiz-option');
            const selectedIdx = parseInt(btn.dataset.idx);
            
            const qData = quizData[currentQuizIdx];
            const isCorrect = selectedIdx === qData.correct;

            // Disable all buttons
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                playSound('correct');
                btn.classList.add('border-green-500', 'bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300');
                btn.classList.remove('border-gray-300', 'dark:border-gray-600');
                score++;
                explanationBox.innerHTML = `<b>✅ Benar!</b><br>${qData.explanation}`;
                explanationBox.classList.remove('bg-blue-100', 'border-blue-500', 'dark:bg-blue-900/50');
                explanationBox.classList.add('bg-green-100', 'border-green-500', 'dark:bg-green-900/50', 'text-green-900', 'dark:text-green-200');
            } else {
                playSound('wrong');
                btn.classList.add('border-red-500', 'bg-red-100', 'dark:bg-red-900/50', 'text-red-800', 'dark:text-red-300');
                btn.classList.remove('border-gray-300', 'dark:border-gray-600');
                
                // Highlight correct answer
                allBtns[qData.correct].classList.add('border-green-500', 'bg-green-100', 'dark:bg-green-900/50');
                allBtns[qData.correct].classList.remove('border-gray-300', 'dark:border-gray-600');

                explanationBox.innerHTML = `<b>❌ Kurang Tepat.</b><br>${qData.explanation}`;
                explanationBox.classList.remove('bg-blue-100', 'border-blue-500', 'dark:bg-blue-900/50');
                explanationBox.classList.add('bg-red-100', 'border-red-500', 'dark:bg-red-900/50', 'text-red-900', 'dark:text-red-200');
            }

            explanationBox.classList.remove('hidden');
            
            // Enable Next Button
            btnNext.disabled = false;
        }

        function updateUI() {
            // Hide all slides
            document.querySelectorAll('.slide-content').forEach(s => s.classList.remove('active'));

            const totalSteps = totalSlides + totalQuiz + 1; // +1 for result
            let currentStep = 0;

            if (!isQuizMode && !quizCompleted) {
                document.getElementById(`slide-${currentSlideIdx}`).classList.add('active');
                currentStep = currentSlideIdx + 1;
                slideCounter.textContent = `${currentStep}/${totalSteps}`;
                btnPrev.disabled = currentSlideIdx === 0;
                btnNext.disabled = false;
                if(currentSlideIdx === totalSlides - 1) {
                    btnNext.innerHTML = 'Mulai Kuis 🚀';
                } else {
                    btnNext.innerHTML = '<span class="hidden sm:inline">Selanjutnya</span> <span>▶</span>';
                }
            } else if (isQuizMode && !quizCompleted) {
                document.getElementById(`quiz-${currentQuizIdx}`).classList.add('active');
                currentStep = totalSlides + currentQuizIdx + 1;
                slideCounter.textContent = `${currentStep}/${totalSteps}`;
                
                // Only allow previous if it's the first quiz question (to go back to lessons)
                btnPrev.disabled = currentQuizIdx !== 0; 
                
                // Disable next until answered
                const currentQuizContainer = document.getElementById(`quiz-${currentQuizIdx}`);
                const isAnswered = currentQuizContainer.querySelector('.explanation-box').classList.contains('hidden') === false;
                btnNext.disabled = !isAnswered;

                // Update score display for next slides
                const scoreDisplays = document.querySelectorAll(`[id^="score-display-"]`);
                scoreDisplays.forEach(el => el.textContent = score * 20);

                if (currentQuizIdx === totalQuiz - 1 && isAnswered) {
                     btnNext.innerHTML = 'Lihat Hasil 🏆';
                } else {
                     btnNext.innerHTML = '<span class="hidden sm:inline">Selanjutnya</span> <span>▶</span>';
                }

            } else if (quizCompleted) {
                document.getElementById(`quiz-result`).classList.add('active');
                currentStep = totalSteps;
                slideCounter.textContent = `Selesai`;
                
                const finalPercentage = (score / totalQuiz) * 100;
                document.getElementById('final-score').textContent = `${finalPercentage}%`;
                
                let msg, icon;
                if (finalPercentage === 100) {
                    msg = "Sempurna! Kamu memiliki insting AI Infrastructure Engineer sejati.";
                    icon = "👑";
                } else if (finalPercentage >= 60) {
                    msg = "Kerja bagus! Sedikit lagi kamu bisa menguasai arsitektur AI.";
                    icon = "🔥";
                } else {
                    msg = "Jangan menyerah! Coba ulangi materi untuk memantapkan pondasi TJKT-mu.";
                    icon = "💪";
                }
                document.getElementById('result-message').textContent = msg;
                document.getElementById('result-icon').textContent = icon;
                playSound('finish');

                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                document.getElementById('dot-indicators').style.display = 'none';
            }

            // Update Progress Bar
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
        }

        btnNext.addEventListener('click', () => {
            playSound('click');
            if (!isQuizMode && !quizCompleted) {
                if (currentSlideIdx < totalSlides - 1) {
                    currentSlideIdx++;
                } else {
                    isQuizMode = true; // Enter quiz mode
                }
            } else if (isQuizMode && !quizCompleted) {
                if (currentQuizIdx < totalQuiz - 1) {
                    currentQuizIdx++;
                } else {
                    quizCompleted = true;
                }
            }
            updateUI();
        });

        btnPrev.addEventListener('click', () => {
            playSound('click');
            if (isQuizMode) {
                if (currentQuizIdx === 0) {
                    isQuizMode = false;
                    currentSlideIdx = totalSlides - 1;
                }
            } else {
                if (currentSlideIdx > 0) {
                    currentSlideIdx--;
                }
            }
            updateUI();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
